<div id="form_rincian">
  <!-- Panel Info Planning dari Rawat Jalan -->
  <div class="col-md-12" id="panel_planning_info" style="display:none;">
    <div class="panel panel-info">
      <div class="panel-heading">
        <h3 class="panel-title"><i class="fa fa-stethoscope"></i> Info Pemeriksaan Rawat Jalan (SOAP)</h3>
      </div>
      <div class="panel-body">
        <div class="row">
          <div class="col-md-12">
            <table class="table table-condensed table-bordered">
              <tr>
                <th width="15%" style="background-color:#d9edf7;">Subjek (Keluhan)</th>
                <td><span id="info_keluhan">-</span></td>
              </tr>
              <tr>
                <th style="background-color:#d9edf7;">Objek (Pemeriksaan)</th>
                <td><span id="info_pemeriksaan">-</span></td>
              </tr>
              <tr>
                <th style="background-color:#d9edf7;">Asesmen (Penilaian)</th>
                <td><span id="info_penilaian">-</span></td>
              </tr>
              <tr>
                <th style="background-color:#fcf8e3;color:#8a6d3b;"><strong>Plan (RTL)</strong></th>
                <td style="background-color:#fcf8e3;">
                  <strong><span id="info_rtl" style="color:#8a6d3b;">-</span></strong>
                  <button type="button" class="btn btn-success btn-sm pull-right" id="btn_parse_rtl" style="margin-top:-5px;">
                    <i class="fa fa-magic"></i> Parse ke e-Resep
                  </button>
                </td>
              </tr>
              <tr>
                <th style="background-color:#f5f5f5;">Instruksi</th>
                <td><span id="info_instruksi">-</span></td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- End Panel Info Planning -->

  <!-- Modal Parse RTL -->
  <div class="modal fade" id="modal_parse_rtl" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-info">
          <button type="button" class="close" data-dismiss="modal">&times;</button>
          <h4 class="modal-title"><i class="fa fa-magic"></i> Hasil Parse RTL ke e-Resep</h4>
        </div>
        <div class="modal-body">
          <div class="alert alert-info">
            <strong>RTL Asli:</strong> <span id="rtl_original_text"></span>
          </div>
          <div id="parse_result_container">
            <p class="text-muted">Menganalisis...</p>
          </div>
          <table class="table table-bordered table-striped" id="tabel_parse_result" style="display:none;">
            <thead>
              <tr>
                <th width="5%"><input type="checkbox" id="check_all_parse" checked></th>
                <th>Nama Obat</th>
                <th width="10%">Stok</th>
                <th width="15%">Jumlah</th>
                <th width="20%">Aturan Pakai</th>
                <th width="10%">Harga</th>
              </tr>
            </thead>
            <tbody id="tbody_parse_result">
            </tbody>
          </table>
          <div id="parse_empty_message" class="alert alert-warning" style="display:none;">
            <i class="fa fa-exclamation-triangle"></i> Tidak ditemukan obat yang cocok dengan RTL. Silakan input manual di bawah.
          </div>
          <hr>
          <div class="form-inline" style="margin-bottom:10px;">
            <div class="form-group" style="width:60%;position:relative;">
              <input type="text" class="form-control" id="cari_obat_parse" placeholder="Ketik nama obat untuk menambahkan..." style="width:100%;">
              <ul class="list-group" id="cari_obat_parse_list" style="z-index:1050;position:absolute;width:100%;max-height:200px;overflow-y:auto;display:none;"></ul>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-success" id="btn_simpan_parse_rtl">
            <i class="fa fa-save"></i> Simpan ke e-Resep
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- End Modal Parse RTL -->

<script>
  $('input:text[name=aturan_pakai]').on('input',function(e){
    var baseURL = mlite.url + '/' + mlite.admin;
    var url    = baseURL + '/apotek_ralan/aturanpakai?t=' + mlite.token;
    var query = $('input:text[name=aturan_pakai]').val();
    if(query!="") {
        $.ajax({
             url: url,
             method:"POST",
             data:{query:query},
             success:function(data)
             {
                  $('#aturan_pakaiList').fadeIn();
                  $('#aturan_pakaiList').html(data);
             }
        });
    }
    $('#aturan_pakaiList').fadeIn();
  });

  $('#aturan_pakaiList').on('click', 'li', function(){
       $('input:text[name=aturan_pakai]').val($(this).text());
       $('#aturan_pakaiList').fadeOut();
  });
</script>

<script>
  $(function() {
      $('#rawat_jl_dr').hide();
      $('#rawat_jl_pr').hide();
      $('#pilih_provider').change(function(){
          if($('#pilih_provider').val() == 'rawat_jl_dr') {
              $('#rawat_jl_dr').show();
              $('#rawat_jl_pr').hide();
          } else if($('#pilih_provider').val() == 'rawat_jl_pr') {
              $('#rawat_jl_dr').hide();
              $('#rawat_jl_pr').show();
          } else {
              $('#rawat_jl_dr').show();
              $('#rawat_jl_pr').show();
          }
      });
  });
</script>
<script>
  var count=2;
  $(document).on('click', '.add_racikan', function(){
      var html = '';
      html += '<div class="form-group row_racikan">';
      html += '    <label class="col-md-3 control-label"><button type="button" class="btn btn-xs btn-danger remove_racikan"><span class="fa fa-minus"></span></button></label>';
      html += '    <div class="col-md-6">';
      html += '        <select name="kode_brng" class="form-control databarang_ajax">';
      html += '        </select>';
      //html += '        <input type="hidden" name="kode_brng" class="form-control" value="">';
      //html += '        <input type="text" name="nama_brng" class="form-control nama_brng" value="">';
      html += '    </div>';
      html += '    <label for="" class="col-sm-1 control-label">Knd.</label>';
      html += '    <div class="col-sm-2">';
      html += '        <input type="text" name="kandungan" id="kandungan" class="form-control" value="">';
      html += '    </div>';
      html += '</div>';
      $('#item_racikan').append(html);
      count++;
      console.log(html);
      var strip_tags = function(str) {
        return (str + '').replace(/<\/?[^>]+(>|$)/g, '')
      };
      var truncate_string = function(str, chars) {
        if ($.trim(str).length <= chars) {
          return str;
        } else {
          return $.trim(str.substr(0, chars)) + '…';
        }
      };
      $('.databarang_ajax').selectator({
        labels: {
          search: 'Cari obat...'
        },
        load: function (search, callback) {
          if (search.length < this.minSearchLength) return callback();
          $.ajax({
            url: '{?=url()?}/{?=ADMIN?}/apotek_ralan/ajax?show=databarang&nama_brng=' + encodeURIComponent(search) + '&t={?=$_SESSION["token"]?}',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
              callback(data.slice(0, 100));
              console.log(data);
            },
            error: function() {
              callback();
            }
          });
        },
        delay: 300,
        minSearchLength: 1,
        valueField: 'kode_brng',
        textField: 'nama_brng'
      });
      $('select').each(function () {
          var options = {
              useDimmer: true,
              useSearch: true,
              labels: {
                  search: '...'
              }
          };
          $.each($(this).data(), function (key, value) {
              options[key] = value;
          });
          $(this).selectator(options);
      });

  });

  $(document).on('click', '.remove_racikan', function(){
      $(this).closest('.row_racikan').remove();
  });
</script>
