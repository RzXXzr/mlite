<style>
.pcare-katalog-wrapper {
    position: relative;
    display: inline-block;
    margin-bottom: 10px;
}
.pcare-katalog-btn {
    background: #337ab7;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s;
}
.pcare-katalog-btn:hover,
.pcare-katalog-btn:focus {
    background: #286090;
    color: #fff;
}
.pcare-katalog-btn i {
    margin-right: 5px;
}
.pcare-katalog-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 1050;
    min-width: 220px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    padding: 6px 0;
    margin-top: 2px;
}
.pcare-katalog-wrapper:hover .pcare-katalog-dropdown,
.pcare-katalog-wrapper.open .pcare-katalog-dropdown {
    display: block;
}
.pcare-katalog-dropdown a {
    display: block;
    padding: 6px 16px;
    color: #333;
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
    transition: background 0.15s;
}
.pcare-katalog-dropdown a:hover {
    background: #f0f4f8;
    color: #337ab7;
}
.pcare-katalog-dropdown a i {
    margin-right: 6px;
    width: 16px;
    text-align: center;
    color: #888;
}
.pcare-katalog-dropdown a:hover i {
    color: #337ab7;
}
</style>
<div class="pcare-katalog-wrapper" id="pcareKatalogWrapper">
    <button type="button" class="pcare-katalog-btn" id="pcareKatalogBtn">
        <i class="fa fa-list"></i> Katalog PCare <i class="fa fa-caret-down" style="margin-left:3px;margin-right:0"></i>
    </button>
    <div class="pcare-katalog-dropdown" id="pcareKatalogDropdown">
        <a href="{?=url([ADMIN,'pcare','manage'])?}"><i class="fa fa-home fa-fw"></i>Home</a>
        <a href="{?=url([ADMIN,'pcare','dashboard'])?}"><i class="fa fa-dashboard fa-fw"></i>Dashboard</a>
        <a href="{?=url([ADMIN,'pcare', 'refdiagnosa'])?}"><i class="fa fa-book fa-fw"></i>Diagnosa</a>
        <a href="{?=url([ADMIN,'pcare', 'refdokter'])?}"><i class="fa fa-book fa-fw"></i>Dokter</a>
        <a href="{?=url([ADMIN,'pcare', 'refkesadaran'])?}"><i class="fa fa-book fa-fw"></i>Kesadaran</a>
        <a href="{?=url([ADMIN,'pcare', 'refkunjungan'])?}"><i class="fa fa-book fa-fw"></i>Kunjungan</a>
        <a href="{?=url([ADMIN,'pcare', 'refobat'])?}"><i class="fa fa-book fa-fw"></i>Obat</a>
        <a href="{?=url([ADMIN,'pcare', 'refpendaftaran'])?}"><i class="fa fa-book fa-fw"></i>Pendaftaran</a>
        <a href="{?=url([ADMIN,'pcare', 'refpeserta'])?}"><i class="fa fa-book fa-fw"></i>Peserta</a>
        <a href="{?=url([ADMIN,'pcare', 'refpoli'])?}"><i class="fa fa-book fa-fw"></i>Poli</a>
        <a href="{?=url([ADMIN,'pcare', 'refprovider'])?}"><i class="fa fa-book fa-fw"></i>Provider</a>
        <a href="{?=url([ADMIN,'pcare', 'reftindakan'])?}"><i class="fa fa-book fa-fw"></i>Tindakan</a>
        <a href="{?=url([ADMIN,'pcare', 'refstatuspulang'])?}"><i class="fa fa-book fa-fw"></i>Status Pulang</a>
        <a href="{?=url([ADMIN,'pcare', 'refkelompok'])?}"><i class="fa fa-book fa-fw"></i>Kelompok</a>
        <a href="{?=url([ADMIN,'pcare', 'refspesialis'])?}"><i class="fa fa-book fa-fw"></i>Spesialis</a>
        <a href="{?=url([ADMIN,'pcare', 'refalergi'])?}"><i class="fa fa-book fa-fw"></i>Alergi</a>
        <a href="{?=url([ADMIN,'pcare', 'refprognosa'])?}"><i class="fa fa-book fa-fw"></i>Prognosa</a>
        <a href="{?=url([ADMIN,'pcare', 'settings'])?}"><i class="fa fa-cog fa-fw"></i>Settings</a>
    </div>
</div>
<script>
(function(){
    var wrapper = document.getElementById('pcareKatalogWrapper');
    var btn = document.getElementById('pcareKatalogBtn');
    if(btn) {
        btn.addEventListener('click', function(e){
            e.stopPropagation();
            wrapper.classList.toggle('open');
        });
    }
    document.addEventListener('click', function(e){
        if(wrapper && !wrapper.contains(e.target)){
            wrapper.classList.remove('open');
        }
    });
})();
</script>
