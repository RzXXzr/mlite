<div class="row">
  <div class="col-sm-12">
    {include: ../plugins/pcare/view/admin/menu.html}
    <div class="panel panel-default">
      <div class="panel-heading">
        <h3 class="panel-title"><i class="fa fa-dashboard"></i> Dashboard Pengiriman PCare</h3>
      </div>
      <div class="panel-body">
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label for="tanggal_dashboard">Pilih Tanggal</label>
              <div class="input-group date tanggal">
                <input type="text" class="form-control" id="tanggal_dashboard" name="tanggal_dashboard" value="{?=date('d-m-Y')?}">
                <span class="input-group-addon" id="btn-kalender-dashboard" style="cursor:pointer">
                  <span class="fa fa-calendar"></span>
                </span>
              </div>
            </div>
          </div>
          <div class="col-md-2">
            <div class="form-group">
              <label>&nbsp;</label>
              <button type="button" class="btn btn-primary btn-block" id="btn-cari-dashboard">
                <i class="fa fa-search"></i> Cari
              </button>
            </div>
          </div>
        </div>
        <hr>
        <div id="display_dashboard">
          <div class="text-center">
            <p><i class="fa fa-spinner fa-spin fa-2x"></i><br>Memuat data hari ini...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Bridging PCare -->
<div class="modal fade" id="bridgingpcareModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            ...
        </div>
    </div>
</div>

<!-- Modal Pendaftaran PCare -->
<div class="modal fade" id="pendaftaranpcareModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            ...
        </div>
    </div>
</div>

<!-- Modal Tindakan & Obat PCare -->
<div class="modal fade" id="bridgingpcaretindakanobatModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            ...
        </div>
    </div>
</div>

<script type="text/javascript">
function loadDashboardData() {
  var tanggal = $('#tanggal_dashboard').val();
  if (!tanggal) {
    tanggal = '{?=date('d-m-Y')?}';
  }
  var baseURL = mlite.url + '/' + mlite.admin;

  $('#display_dashboard').html('<div class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><br>Memuat data...</div>');

  var loadURL = baseURL + '/pcare/dashboarddisplay?date=' + encodeURIComponent(tanggal) + '&t=' + mlite.token;

  $.ajax({
    url: loadURL,
    type: 'GET',
    success: function(response) {
      $('#display_dashboard').html(response);
    },
    error: function(xhr) {
      $('#display_dashboard').html('<div class="alert alert-danger">Terjadi kesalahan saat memuat data: ' + xhr.statusText + '</div>');
    }
  });
}

$(document).ready(function () {
  try {
    $('.tanggal').datetimepicker({
      format: 'DD-MM-YYYY',
      locale: 'id',
      showTodayButton: true,
      showClear: true,
      allowInputToggle: true,
      useCurrent: true
    });
  } catch(e) {
    console.log('Datetimepicker init error:', e);
  }

  $(document).on('click', '#btn-kalender-dashboard', function(e) {
    e.preventDefault();
    e.stopPropagation();
    $('#tanggal_dashboard').focus();
    var picker = $('.tanggal').data('DateTimePicker');
    if (picker) {
      picker.toggle();
    }
  });

  $(document).on('click', '#btn-cari-dashboard', function() {
    loadDashboardData();
  });

  $(document).on('keypress', '#tanggal_dashboard', function(e) {
    if (e.which == 13) {
      loadDashboardData();
    }
  });

  // Auto-load data hari ini
  setTimeout(function() {
    loadDashboardData();
  }, 300);
});

// Auto-refresh dashboard saat modal ditutup
$('#bridgingpcareModal, #pendaftaranpcareModal, #bridgingpcaretindakanobatModal').on('hidden.bs.modal', function () {
  loadDashboardData();
});

// Handle Bridging PCare button (Kirim Kunjungan)
$(document).on("click", ".btn-bridging-pcare", function(event){
  var baseURL = mlite.url + '/' + mlite.admin;
  event.preventDefault();
  var no_rkm_medis = $(this).attr("data-no_rkm_medis");
  var tgl_registrasi = $(this).attr("data-tgl_registrasi");
  var loadURL = baseURL + '/pcare/bridgingpcare/' + no_rkm_medis + '/' + tgl_registrasi + '?t=' + mlite.token;

  var modal = $('#bridgingpcareModal');
  var modalContent = $('#bridgingpcareModal .modal-content');

  modal.off('show.bs.modal');
  modal.on('show.bs.modal', function () {
      modalContent.load(loadURL);
  }).modal();
  return false;
});

// Handle Pendaftaran PCare button
$(document).on("click", ".btn-pendaftaran-pcare", function(event){
  var baseURL = mlite.url + '/' + mlite.admin;
  event.preventDefault();
  var no_rkm_medis = $(this).attr("data-no_rkm_medis");
  var tgl_registrasi = $(this).attr("data-tgl_registrasi");
  var loadURL = baseURL + '/pcare/pendaftaranpcare/' + no_rkm_medis + '/' + tgl_registrasi + '?t=' + mlite.token;

  var modal = $('#pendaftaranpcareModal');
  var modalContent = $('#pendaftaranpcareModal .modal-content');

  modal.off('show.bs.modal');
  modal.on('show.bs.modal', function () {
      modalContent.load(loadURL);
  }).modal();
  return false;
});
</script>
