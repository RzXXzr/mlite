<script type="text/javascript">
$(function () {
  // Initialize datetimepicker dengan opsi lengkap
  $('.tanggal').datetimepicker({
    format: 'DD-MM-YYYY',
    locale: 'id',
    showTodayButton: true,
    showClear: true,
    allowInputToggle: true,
    useCurrent: true
  });
  
  // Klik tombol kalender untuk memunculkan date picker
  $(document).on('click', '#btn-kalender', function(e) {
    e.preventDefault();
    e.stopPropagation();
    $('#tanggal').focus();
    var picker = $('.tanggal').data('DateTimePicker');
    if (picker) {
      picker.toggle();
    }
  });
  
  // Initialize modal datetimepickers
  $('.tanggal-form').datetimepicker({
    format: 'DD-MM-YYYY',
    locale: 'id',
    allowInputToggle: true
  });
});
</script>

<script type="text/javascript">
$('#btn-cari').on('click', function() {
  loadDataKunjunganBpjs();
});

$('#tanggal').on('keypress', function(e) {
  if (e.which == 13) {
    loadDataKunjunganBpjs();
  }
});

function loadDataKunjunganBpjs() {
  var tanggal = $('#tanggal').val();
  var baseURL = mlite.url + '/' + mlite.admin;
  
  $('#display_kunjungan_bpjs').html('<div class="text-center"><i class="fa fa-spinner fa-spin fa-3x"></i><br>Memuat data...</div>');
  
  var loadURL = baseURL + '/pcare/datakunjunganbpjsdisplay?date=' + encodeURIComponent(tanggal) + '&t=' + mlite.token;
  
  $('#display_kunjungan_bpjs').load(loadURL, function(response, status, xhr) {
    if (status == "error") {
      $('#display_kunjungan_bpjs').html('<div class="alert alert-danger">Terjadi kesalahan saat memuat data: ' + xhr.statusText + '</div>');
    }
  });
}

// Handle kirim kunjungan button click - Open Modal Form (event delegation)
$(document).on('click', '.btn-kirim-kunjungan', function(e) {
  e.preventDefault();
  var btn = $(this);
  
  // Ambil data dari button attributes
  var id = btn.data('id');
  var no_rawat = btn.data('no_rawat');
  var no_rkm_medis = btn.data('no_rkm_medis');
  var nomor_jaminan = btn.data('nomor_jaminan');
  var nm_pasien = btn.data('nm_pasien');
  var nama_poli = btn.data('nama_poli');
  var kd_poli = btn.data('kd_poli');
  var nama_dokter = btn.data('nama_dokter');
  var kd_dokter = btn.data('kd_dokter');
  var tgl_kunjungan = btn.data('tgl_kunjungan');
  var tgl_daftar = btn.data('tgl_daftar');
  var kunjungan_sakit = btn.data('kunjungan_sakit');
  var subyektif = btn.data('subyektif');
  var sistole = btn.data('sistole');
  var diastole = btn.data('diastole');
  var berat = btn.data('berat');
  var tinggi = btn.data('tinggi');
  var nadi = btn.data('nadi');
  var respirasi = btn.data('respirasi');
  var lingkar_perut = btn.data('lingkar_perut');
  var kd_kesadaran = btn.data('kd_kesadaran');
  var nama_kesadaran = btn.data('nama_kesadaran');
  var kd_status_pulang = btn.data('kd_status_pulang');
  var nama_status_pulang = btn.data('nama_status_pulang');
  var kd_diagnosa1 = btn.data('kd_diagnosa1');
  var nama_diagnosa1 = btn.data('nama_diagnosa1');
  var kd_diagnosa2 = btn.data('kd_diagnosa2');
  var nama_diagnosa2 = btn.data('nama_diagnosa2');
  var kd_diagnosa3 = btn.data('kd_diagnosa3');
  var nama_diagnosa3 = btn.data('nama_diagnosa3');
  var terapi = btn.data('terapi');
  var tgl_pulang = btn.data('tgl_pulang');
  var kode_provider = btn.data('kode_provider');
  var anamnesa = btn.data('anamnesa');
  var kd_prognosa = btn.data('kd_prognosa');
  var nama_prognosa = btn.data('nama_prognosa');
  var kd_alergi_makan = btn.data('kd_alergi_makan');
  var nama_alergi_makan = btn.data('nama_alergi_makan');
  var kd_alergi_udara = btn.data('kd_alergi_udara');
  var nama_alergi_udara = btn.data('nama_alergi_udara');
  var kd_alergi_obat = btn.data('kd_alergi_obat');
  var nama_alergi_obat = btn.data('nama_alergi_obat');
  
  // Konversi format tanggal dari YYYY-MM-DD ke DD-MM-YYYY untuk ditampilkan
  function formatDate(dateStr) {
    if (!dateStr || dateStr === 'undefined' || dateStr === 'null' || dateStr === '') return '';
    if (String(dateStr).indexOf('-') === 2) return dateStr; // Sudah format DD-MM-YYYY
    var parts = String(dateStr).split('-');
    if (parts.length !== 3) return dateStr;
    return parts[2] + '-' + parts[1] + '-' + parts[0];
  }
  
  // Helper untuk nilai default
  function safeVal(val, def) {
    if (val === undefined || val === null || val === '' || val === 'undefined' || val === 'null') return def || '';
    return val;
  }
  
  // Isi form modal dengan data
  $('#id_bridging').val(id);
  $('#modal_no_rawat').val(safeVal(no_rawat));
  $('#modal_no_rkm_medis').val(safeVal(no_rkm_medis));
  $('#modal_nomor_jaminan').val(safeVal(nomor_jaminan));
  $('#modal_nm_pasien').val(safeVal(nm_pasien));
  $('#modal_kode_provider').val(safeVal(kode_provider));
  
  // Tanggal Daftar
  $('#modal_tgl_daftar').val(formatDate(tgl_daftar) || formatDate(tgl_kunjungan));
  
  // Poliklinik
  $('#modal_getPoli').val(safeVal(nama_poli));
  $('#kdPoli').val(safeVal(kd_poli));
  
  // Jenis Kunjungan & Layanan
  $('#modal_kunjungan_sakit').val(kunjungan_sakit === 'true' || kunjungan_sakit === true ? 'true' : 'false');
  $('#modal_jenis_layanan').val('1'); // Default Rawat Jalan
  
  // Keluhan
  $('#modal_subyektif').val(safeVal(subyektif));
  
  // Vital Sign
  $('#modal_sistole').val(safeVal(sistole, '0'));
  $('#modal_diastole').val(safeVal(diastole, '0'));
  $('#modal_nadi').val(safeVal(nadi, '0'));
  $('#modal_respirasi').val(safeVal(respirasi, '0'));
  $('#modal_suhu').val('36');
  $('#modal_tinggi').val(safeVal(tinggi, '0'));
  $('#modal_berat').val(safeVal(berat, '0'));
  $('#modal_lingkar_perut').val(safeVal(lingkar_perut, '0'));
  
  // Tanggal Kunjungan & Pulang
  var tglKunj = formatDate(tgl_kunjungan) || formatDate(tgl_daftar);
  $('#modal_tgl_kunjungan').val(tglKunj);
  $('#modal_tgl_pulang').val(formatDate(tgl_pulang) || tglKunj);
  
  // Dokter
  $('#modal_getDokter').val(safeVal(nama_dokter));
  $('#kdDokter').val(safeVal(kd_dokter));
  
  // Pemeriksaan / Anamnesa
  $('#modal_anamnesa').val(safeVal(anamnesa));
  
  // Terapi
  $('#modal_terapi').val(safeVal(terapi));
  
  // Status Pulang
  $('#modal_getStatusPulang').val(safeVal(nama_status_pulang));
  $('#kdStatusPulang').val(safeVal(kd_status_pulang));
  
  // Kesadaran
  $('#modal_getKesadaran').val(safeVal(nama_kesadaran));
  $('#kdKesadaran').val(safeVal(kd_kesadaran));
  
  // Prognosa
  $('#modal_getPrognosa').val(safeVal(nama_prognosa));
  $('#kdPrognosa').val(safeVal(kd_prognosa));
  
  // Diagnosa 1
  if (kd_diagnosa1 && kd_diagnosa1 !== 'undefined') {
    $('#modal_getDiagnosa1').val(kd_diagnosa1 + (nama_diagnosa1 && nama_diagnosa1 !== 'undefined' ? ' - ' + nama_diagnosa1 : ''));
    $('#kdDiagnosa1').val(kd_diagnosa1);
  } else {
    $('#modal_getDiagnosa1').val('');
    $('#kdDiagnosa1').val('');
  }
  
  // Diagnosa 2
  if (kd_diagnosa2 && kd_diagnosa2 !== 'undefined') {

// Fungsi ambil kode provider dari BPJS
function ambilKodeProvider(nomor_jaminan) {
  if (!nomor_jaminan) return;
  var baseURL = mlite.url + '/' + mlite.admin;
  $.get(baseURL + '/pcare/peserta/' + nomor_jaminan + '?t=' + mlite.token, function(data){
    try {
      var json_obj = JSON.parse(data);
      if(json_obj && json_obj.metaData && json_obj.metaData.code == 200) {
        $('#modal_kode_provider').val(json_obj.response.kdProviderPst.kdProvider);
      }
    } catch(e) {}
  });
}

// Helper function untuk filter dan render list
function renderFilteredList(data, keyword, listEl, kodeField, namaField, kodeAttr, namaAttr) {
  listEl.empty();
  if (!data) return;
  var filtered = data.filter(function(item) {
    if (!keyword) return true;
    return item[namaField].toLowerCase().indexOf(keyword.toLowerCase()) !== -1 ||
           String(item[kodeField]).toLowerCase().indexOf(keyword.toLowerCase()) !== -1;
  });
  $.each(filtered, function(i, val) {
    listEl.append('<li class="list-group-item" style="cursor:pointer" data-kode="'+val[kodeField]+'" data-nama="'+val[namaField]+'">'+val[namaField]+'</li>');
  });
}

// Autocomplete Prognosa dengan cache dan filter
function loadPrognosaList(keyword) {
  var listEl = $('#modal_prognosaList');
  if (pcareCache.prognosa) {
    renderFilteredList(pcareCache.prognosa, keyword, listEl, 'kdPrognosa', 'nmPrognosa');
  } else {
    listEl.html('<li class="list-group-item"><i class="fa fa-spinner fa-spin"></i> Memuat...</li>');
    $.get(baseURL + '/pcare/prognosa?t=' + mlite.token, function(data) {
      var json_obj = JSON.parse(data);
      if(json_obj.metaData && json_obj.metaData.code == 200 && json_obj.response && json_obj.response.list) {
        pcareCache.prognosa = json_obj.response.list;
        renderFilteredList(pcareCache.prognosa, keyword, listEl, 'kdPrognosa', 'nmPrognosa');
      } else {
        listEl.html('<li class="list-group-item text-danger">Gagal memuat data</li>');
      }
    }).fail(function() {
      listEl.html('<li class="list-group-item text-danger">Gagal memuat data</li>');
    });
  }
}

// Submit Kirim Kunjungan
$('#btn-kirim-submit').on('click', function() {
  var btn = $(this);
  var id = $('#id_bridging').val();
  
  // Validasi field wajib
  if (!$('#kdDiagnosa1').val()) {
    alert('Diagnosa 1 wajib diisi!');
    $('#modal_getDiagnosa1').focus();
    return;
  }
  if (!$('#kdDokter').val()) {
    alert('Dokter wajib diisi!');
    $('#modal_getDokter').focus();
    return;
  }
  if (!$('#kdKesadaran').val()) {
    alert('Kesadaran wajib diisi!');
    $('#modal_getKesadaran').focus();
    return;
  }
  if (!$('#kdStatusPulang').val()) {
    alert('Status Pulang wajib diisi!');
    $('#modal_getStatusPulang').focus();
    return;
  }
  
  btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Mengirim...');
  
  // Konversi tanggal dari DD-MM-YYYY ke YYYY-MM-DD untuk API
  function convertDate(dateStr) {
    if (!dateStr) return '';
    var parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return parts[2] + '-' + parts[1] + '-' + parts[0];
  }
  
  var formData = {
    id: id,
    no_rawat: $('#modal_no_rawat').val(),
    no_rkm_medis: $('#modal_no_rkm_medis').val(),
    nomor_jaminan: $('#modal_nomor_jaminan').val(),
    kode_provider: $('#modal_kode_provider').val(),
    tgl_daftar: convertDate($('#modal_tgl_daftar').val()),
    tgl_kunjungan: convertDate($('#modal_tgl_kunjungan').val()),
    tgl_pulang: convertDate($('#modal_tgl_pulang').val()),
    kunjungan_sakit: $('#modal_kunjungan_sakit').val(),
    jenis_layanan: $('#modal_jenis_layanan').val(),
    subyektif: $('#modal_subyektif').val(),
    sistole: $('#modal_sistole').val(),
    diastole: $('#modal_diastole').val(),
    berat: $('#modal_berat').val(),
    tinggi: $('#modal_tinggi').val(),
    nadi: $('#modal_nadi').val(),
    respirasi: $('#modal_respirasi').val(),
    suhu: $('#modal_suhu').val(),
    lingkar_perut: $('#modal_lingkar_perut').val(),
    kdDokter: $('#kdDokter').val(),
    kdKesadaran: $('#kdKesadaran').val(),
    kdStatusPulang: $('#kdStatusPulang').val(),
    kdPrognosa: $('#kdPrognosa').val(),
    kdDiagnosa1: $('#kdDiagnosa1').val(),
    kdDiagnosa2: $('#kdDiagnosa2').val(),
    kdDiagnosa3: $('#kdDiagnosa3').val(),
    kdPoli: $('#kdPoli').val(),
    anamnesa: $('#modal_anamnesa').val(),
    terapi: $('#modal_terapi').val(),
    terapiObat: $('#modal_terapiObat').val(),
    terapiNonObat: $('#modal_terapiNonObat').val(),
    kdAlergiMakan: $('#kdAlergiMakan').val(),
    kdAlergiUdara: $('#kdAlergiUdara').val(),
    kdAlergiObat: $('#kdAlergiObat').val(),
    t: mlite.token
  };
  
  $.ajax({
    url: baseURL + '/pcare/kirimkunjunganbpjs',
    type: 'POST',
    data: formData,
    success: function(response) {
      try {
        var result = JSON.parse(response);
        if (result.status === 'success') {
          alert('Berhasil! No. Kunjungan: ' + result.nomor_kunjungan);
          $('#kirimKunjunganModal').modal('hide');
          // Reload data
          loadDataKunjunganBpjs();
        } else {
          alert('Gagal: ' + result.message);
          btn.prop('disabled', false).html('<i class="fa fa-send"></i> Kirim ke PCare');
        }
      } catch(e) {
        alert('Response: ' + response);
        btn.prop('disabled', false).html('<i class="fa fa-send"></i> Kirim ke PCare');
      }
    },
    error: function(xhr, status, error) {
      alert('Error: ' + error);
      btn.prop('disabled', false).html('<i class="fa fa-send"></i> Kirim ke PCare');
    }
  });
});
