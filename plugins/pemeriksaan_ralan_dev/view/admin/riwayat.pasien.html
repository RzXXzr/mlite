<aside id="dev-patient-history" class="dev-longitudinal" aria-label="Riwayat pasien">
  <div class="dev-longitudinal-head">
    <div><span class="dev-eyebrow">REFERENSI PASIEN</span><h3><i class="fa fa-history"></i> Riwayat kunjungan</h3></div>
    <a id="dev-full-erm" class="btn btn-default btn-sm" target="_blank" rel="noopener" style="display:none;" title="Buka rekam medis lengkap di tab baru"><i class="fa fa-external-link"></i> Rekam medis</a>
  </div>
  <div class="dev-history-scroll" tabindex="0" aria-label="Daftar riwayat pasien">
    <details class="dev-current-records" open>
      <summary>Catatan kunjungan aktif <span>Edit atau koreksi catatan tersimpan</span></summary>
      <div id="dev-history"></div>
    </details>
    <div class="dev-history-divider"><strong>Seluruh kunjungan</strong><span>Buka catatan, lalu salin kolom yang diperlukan.</span></div>
    <div id="dev-all-visits" aria-live="polite"></div>
  </div>
  <div class="dev-history-pagination">
    <button type="button" id="dev-history-prev" class="btn btn-default btn-sm" disabled aria-label="Halaman kunjungan lebih baru"><i class="fa fa-chevron-left"></i> Baru</button>
    <span id="dev-history-page" aria-live="polite"></span>
    <button type="button" id="dev-history-next" class="btn btn-default btn-sm" disabled aria-label="Halaman kunjungan lebih lama">Lama <i class="fa fa-chevron-right"></i></button>
  </div>
</aside>
