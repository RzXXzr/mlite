{{define "content"}}
<div class="panel panel-default">
    <div class="panel-heading"><h3 class="panel-title"><i class="fa fa-book"></i> Referensi Diagnosa</h3></div>
    <div class="panel-body">
        <div class="row"><div class="col-md-6"><div class="input-group"><input type="text" class="form-control" id="keyword" placeholder="Keyword diagnosa (min 3 huruf)"><span class="input-group-btn"><button class="btn btn-primary" id="btnCari"><i class="fa fa-search"></i></button></span></div></div></div>
        <div class="table-responsive" style="margin-top:15px">
            <table class="table table-striped table-bordered" id="tblData"><thead><tr><th>Kode</th><th>Nama</th></tr></thead><tbody id="tblBody"></tbody></table>
        </div>

    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
$('#btnCari').click(function(){
    var kw=$('#keyword').val();if(!kw||kw.length<3){showAlert('warning','Min 3 huruf');return;}
    apiCall('GET','/diagnosa/'+encodeURIComponent(kw)+'/0/100').done(function(r){
        var list=pcare.list(r);var b='';
        if(Array.isArray(list)){$.each(list,function(i,d){b+='<tr><td>'+d.kdDiag+'</td><td>'+d.nmDiag+'</td></tr>';});}
        $('#tblBody').html(b||'<tr><td colspan="2">Tidak ditemukan</td></tr>');

    });
});
$('#keyword').on('keypress',function(e){if(e.which==13)$('#btnCari').click();});
</script>
{{end}}
