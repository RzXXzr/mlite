{{define "content"}}
<div class="panel panel-default">
    <div class="panel-heading"><h3 class="panel-title"><i class="fa fa-hospital-o"></i> Referensi Poliklinik</h3></div>
    <div class="panel-body">
        <button class="btn btn-primary" id="btnLoad"><i class="fa fa-refresh"></i> Muat Data</button>
        <div class="table-responsive" style="margin-top:15px">
            <table class="table table-striped table-bordered" id="tblData"><thead><tr><th>Kode</th><th>Nama</th></tr></thead><tbody id="tblBody"></tbody></table>
        </div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
$('#btnLoad').click(function(){
    apiCall('GET','/poli/0/200').done(function(r){
        var list=pcare.list(r);var b='';
        $.each(list,function(i,p){b+='<tr><td>'+p.kdPoli+'</td><td>'+p.nmPoli+'</td></tr>';});
        $('#tblBody').html(b||'<tr><td colspan="2">Tidak ada data</td></tr>');
    });
});
</script>
{{end}}
