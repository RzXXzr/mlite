{{define "content"}}
<div class="panel panel-default">
    <div class="panel-heading"><h3 class="panel-title"><i class="fa fa-cog"></i> Pengaturan PCare BPJS</h3></div>
    <div class="panel-body">
        <form id="settingsForm">
            <div class="row">
                <div class="col-md-6">
                    <h4>Koneksi API PCare</h4>
                    <div class="form-group">
                        <label>PCare API URL</label>
                        <input type="text" class="form-control" name="pcare_api_url" value="{{.Settings.PCareAPIURL}}">
                    </div>
                    <div class="form-group">
                        <label>Consumer ID</label>
                        <input type="text" class="form-control" name="pcare_consumer_id" value="{{.Settings.ConsumerID}}">
                    </div>
                    <div class="form-group">
                        <label>Consumer Secret</label>
                        <input type="password" class="form-control" name="pcare_consumer_secret" value="{{.Settings.ConsumerSecret}}">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" class="form-control" name="pcare_username" value="{{.Settings.Username}}">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" name="pcare_password" value="{{.Settings.Password}}">
                    </div>
                    <div class="form-group">
                        <label>User Key</label>
                        <input type="text" class="form-control" name="pcare_user_key" value="{{.Settings.UserKey}}">
                    </div>
                    <div class="form-group">
                        <label>Kode Aplikasi</label>
                        <input type="text" class="form-control" name="pcare_kd_aplikasi" value="{{.Settings.KdAplikasi}}">
                    </div>
                </div>
                <div class="col-md-6">
                    <h4>Informasi Faskes</h4>
                    <div class="form-group">
                        <label>Kode FKTP</label>
                        <input type="text" class="form-control" name="pcare_kode_fktp" value="{{.Settings.KodeFKTP}}">
                    </div>
                    <div class="form-group">
                        <label>Nama FKTP</label>
                        <input type="text" class="form-control" name="pcare_nama_fktp" value="{{.Settings.NamaFKTP}}">
                    </div>
                    <div class="form-group">
                        <label>Kode Kabupaten / Kota</label>
                        <input type="text" class="form-control" name="pcare_kode_kabupaten_kota" value="{{.Settings.KodeKabupatenKota}}">
                    </div>
                    <div class="form-group">
                        <label>Kabupaten / Kota</label>
                        <input type="text" class="form-control" name="pcare_kabupaten_kota" value="{{.Settings.KabupatenKota}}">
                    </div>
                    <div class="form-group">
                        <label>Wilayah</label>
                        <input type="text" class="form-control" name="pcare_wilayah" value="{{.Settings.Wilayah}}">
                    </div>
                    <div class="form-group">
                        <label>Cabang</label>
                        <input type="text" class="form-control" name="pcare_cabang" value="{{.Settings.Cabang}}">
                    </div>
                    <div class="form-group">
                        <label>Kode Penjamin BPJS (kd_pj di SIMRS)</label>
                        <input type="text" class="form-control" name="kd_pj_bpjs" value="{{.Settings.KdPjBpjs}}">
                    </div>
                </div>
            </div>
            <hr>
            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Simpan Pengaturan</button>
        </form>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
$('#settingsForm').on('submit', function(e) {
    e.preventDefault();
    var data = {};
    $(this).find('input').each(function() {
        data[$(this).attr('name')] = $(this).val();
    });
    apiCall('POST', '/settings', data).done(function(res) {
        showAlert('success', 'Pengaturan berhasil disimpan');
    }).fail(function(xhr) {
        showAlert('danger', 'Gagal menyimpan: ' + (xhr.responseJSON ? xhr.responseJSON.error : xhr.statusText));
    });
});
</script>
{{end}}
