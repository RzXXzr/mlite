<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    <h4 class="modal-title">Push Medication Satu Sehat</h4>
</div>
<div class="modal-body" style="text-align:center; padding:30px;">
  <div id="response" style="display:none;">{$response}</div>
  <div id="pushResult"></div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-primary" data-dismiss="modal">Tutup</button>
</div>
<script>
    var response = $('#response').text();
    try {
      var data = JSON.parse(response);
      if (data.id) {
        $('#pushResult').html(
          '<i class="fa fa-check-circle" style="font-size:60px; color:#27ae60; margin-bottom:15px;"></i>' +
          '<h4 style="color:#27ae60;">{$pesan}</h4>' +
          '<p class="text-muted">ID: ' + data.id + '</p>'
        );
        // Reload halaman setelah modal ditutup
        $('#pushResult').closest('.modal').on('hidden.bs.modal', function(){ location.reload(); });
      } else {
        var errMsg = data.issue ? data.issue[0].diagnostics : JSON.stringify(data);
        $('#pushResult').html(
          '<i class="fa fa-times-circle" style="font-size:60px; color:#e74c3c; margin-bottom:15px;"></i>' +
          '<h4 style="color:#e74c3c;">Gagal Push</h4>' +
          '<p class="text-muted" style="word-break:break-all;">' + errMsg + '</p>'
        );
      }
    } catch(e) {
      $('#pushResult').html(
        '<i class="fa fa-exclamation-circle" style="font-size:60px; color:#f39c12; margin-bottom:15px;"></i>' +
        '<h4 style="color:#f39c12;">Tidak ada respon</h4>' +
        '<p class="text-muted">Silakan cek koneksi dan coba lagi.</p>'
      );
    }
</script>
