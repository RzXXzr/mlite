{{define "content"}}
<style>
#responseTable { font-size: 12px; }
#responseTable th, #responseTable td { white-space: nowrap; vertical-align: middle !important; padding: 5px 8px !important; }
#responseTable td.details-control { cursor: pointer; text-align: center; color: #337ab7; font-size: 14px; }
#responseTable td.details-control:hover { color: #23527c; }
tr.shown td.details-control i:before { content: "\f068"; }
.detail-box { background: #f9f9f9; padding: 10px 15px; }
.detail-box .section-title { font-weight: 700; font-size: 11px; text-transform: uppercase; color: #555; margin: 8px 0 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
.detail-box .section-title:first-child { margin-top: 0; }
.detail-box .fhir-grid { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.detail-box .fhir-item { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; min-width: 180px; padding: 1px 0; }
.detail-box .fhir-label { color: #777; min-width: 70px; }
.detail-box .fhir-val { font-family: monospace; font-size: 10px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-box .fhir-val.sent { color: #3c763d; }
.detail-box .fhir-val.empty { color: #999; font-style: italic; font-family: inherit; }
.badge-error { background: #d9534f; color: #fff; }
.badge-success { background: #5cb85c; color: #fff; }
.badge-warning { background: #f0ad4e; color: #fff; }
.badge-info { background: #5bc0de; color: #fff; }
</style>
<div class="panel panel-default">
    <div class="panel-heading">
        <div class="btn-group pull-right" style="margin-top:-8px;">
            <span class="btn btn-sm dropdown-toggle" data-toggle="dropdown">
                <i class="fa fa-calendar"></i><span class="hidden-xs"> Periode Tanggal</span>
            </span>
            <ul class="dropdown-menu dropdown-menu-right" style="padding:10px;min-width:220px;">
                <li style="padding:0 5px;">
                    <label style="font-size:12px;margin-bottom:2px;">Tanggal Awal</label>
                    <input type="text" id="tanggal_awal" class="form-control tanggal" required>
                </li>
                <li style="padding:0 5px;margin-top:5px;">
                    <label style="font-size:12px;margin-bottom:2px;">Tanggal Akhir</label>
                    <input type="text" id="tanggal_akhir" class="form-control tanggal" required>
                </li>
                <li style="padding:0 5px;margin-top:5px;">
                    <button class="btn btn-primary btn-block" id="btnFilterDate">Cari</button>
                </li>
            </ul>
        </div>
        <h3 class="panel-title">Data Response Satu Sehat
            <a href="/api/forward-tanggal" class="btn btn-info btn-xs" target="_blank"><i class="fa fa-send"></i> Kirim Massal</a>
        </h3>
    </div>
    <div class="panel-body" style="padding:8px;">
        <table class="table display table-bordered table-striped" width="100%" id="responseTable">
            <thead>
                <tr>
                    <th style="width:20px;"></th>
                    <th>Tgl. Rawat</th>
                    <th>No. Rawat</th>
                    <th>No. RM</th>
                    <th>Nama Pasien</th>
                    <th>Dokter</th>
                    <th>Poli</th>
                    <th>Status</th>
                    <th>FHIR</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
<div class="modal fade" id="actionModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content" id="modalContent">
            <div class="modal-body text-center"><i class="fa fa-spinner fa-spin fa-2x"></i> Loading...</div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
$(document).ready(function(){
    var tanggal_awal = '', tanggal_akhir = '';

    function countFhirSent(row) {
        var fields = [
            'id_encounter','id_condition','id_clinical_impression',
            'id_observation_ttvtensi','id_observation_ttvnadi','id_observation_ttvrespirasi',
            'id_observation_ttvsuhu','id_observation_ttvspo2','id_observation_ttvgcs',
            'id_observation_ttvtinggi','id_observation_ttvberat','id_observation_ttvperut',
            'id_observation_ttvkesadaran','id_procedure','id_composition',
            'id_medication_request','id_medication_dispense','id_medication_statement',
            'id_careplan','id_allergy','id_questionnaire',
            'id_rad_request','id_rad_specimen','id_rad_observation','id_rad_diagnostic',
            'id_lab_pk_request','id_lab_pk_specimen','id_lab_pk_observation','id_lab_pk_diagnostic'
        ];
        var sent = 0;
        for(var i=0;i<fields.length;i++) { if(row[fields[i]]) sent++; }
        return sent;
    }

    function formatDetail(row) {
        var noRawat = (row.no_rawat||'').replace(/\//g, '--');
        var hd = row.has_data || {};

        function fi(label, idVal, tipe, ttv, hdKey) {
            var html = '<span class="fhir-item"><span class="fhir-label">'+label+'</span>';
            if(idVal) {
                html += '<span class="fhir-val sent" title="'+idVal+'">'+idVal+'</span>';
            } else if(hdKey && !hd[hdKey]) {
                html += '<span class="fhir-val empty">Tidak ada data</span>';
            } else {
                var bd = 'data-id="'+noRawat+'" data-tipe="'+tipe+'"';
                if(ttv) bd += ' data-ttv="'+ttv+'"';
                html += '<a href="#" class="btn btn-xs btn-info btn-action" '+bd+' style="padding:0 4px;font-size:10px;"><i class="fa fa-send"></i> Kirim</a>';
            }
            html += '</span>';
            return html;
        }

        var h = '<div class="detail-box">';
        h += '<div class="row" style="margin-bottom:6px;font-size:11px;">';
        h += '<div class="col-xs-6 col-md-3"><b>No. KTP:</b> '+(row.no_ktp_pasien||'-')+'</div>';
        h += '<div class="col-xs-6 col-md-3"><b>Kd. Dokter:</b> '+(row.kd_dokter||'-')+' <span class="text-muted">('+(row.praktisi_id||'-')+')</span></div>';
        h += '<div class="col-xs-6 col-md-2"><b>Status Bayar:</b> '+(row.status_bayar||'-')+'</div>';
        h += '<div class="col-xs-6 col-md-2"><b>Tgl Pulang:</b> '+(row.tgl_pulang||'<em class="text-danger">Belum</em>')+'</div>';
        h += '<div class="col-xs-6 col-md-2"><b>Status Lanjut:</b> '+(row.status_lanjut||'-')+'</div>';
        h += '</div>';

        h += '<div class="section-title">Encounter & Diagnosis</div>';
        h += '<div class="fhir-grid">';
        h += fi('Encounter', row.id_encounter, 'encounter');
        h += fi('Condition', row.id_condition, 'condition', '', 'condition');
        h += fi('Clin. Impr.', row.id_clinical_impression, 'clinicalimpression', '', 'clinical_impression');
        h += fi('Procedure', row.id_procedure, 'procedure', '', 'procedure');
        h += fi('Care Plan', row.id_careplan, 'careplan', '', 'careplan');
        h += fi('Allergy', row.id_allergy, 'allergy', '', 'allergy');
        h += fi('Composition', row.id_composition, 'dietgizi', '', 'composition');
        h += fi('Questionnaire', row.id_questionnaire, 'questionnaire', '', 'questionnaire');
        h += '</div>';

        h += '<div class="section-title">Observations (TTV)</div>';
        h += '<div class="fhir-grid">';
        h += fi('Tensi', row.id_observation_ttvtensi, 'observation', 'tensi', 'observation_tensi');
        h += fi('Nadi', row.id_observation_ttvnadi, 'observation', 'nadi', 'observation_nadi');
        h += fi('Respirasi', row.id_observation_ttvrespirasi, 'observation', 'respirasi', 'observation_respirasi');
        h += fi('Suhu', row.id_observation_ttvsuhu, 'observation', 'suhu', 'observation_suhu');
        h += fi('SpO2', row.id_observation_ttvspo2, 'observation', 'spo2', 'observation_spo2');
        h += fi('GCS', row.id_observation_ttvgcs, 'observation', 'gcs', 'observation_gcs');
        h += fi('Tinggi', row.id_observation_ttvtinggi, 'observation', 'tinggi', 'observation_tinggi');
        h += fi('Berat', row.id_observation_ttvberat, 'observation', 'berat', 'observation_berat');
        h += fi('Perut', row.id_observation_ttvperut, 'observation', 'perut', 'observation_perut');
        h += fi('Kesadaran', row.id_observation_ttvkesadaran, 'observation', 'kesadaran', 'observation_kesadaran');
        h += '</div>';

        h += '<div class="section-title">Medication</div>';
        h += '<div class="fhir-grid">';
        h += fi('Request', row.id_medication_request, 'medication', 'request', 'medication_request');
        h += fi('Dispense', row.id_medication_dispense, 'medication', 'dispense', 'medication_dispense');
        h += fi('Statement', row.id_medication_statement, 'medication', 'statement', 'medication_statement');
        h += '</div>';

        h += '<div class="section-title">Laboratorium PK</div>';
        h += '<div class="fhir-grid">';
        h += fi('Request', row.id_lab_pk_request, 'laboratory', 'request', 'lab_request');
        h += fi('Specimen', row.id_lab_pk_specimen, 'laboratory', 'specimen', 'lab_specimen');
        h += fi('Observation', row.id_lab_pk_observation, 'laboratory', 'observation', 'lab_observation');
        h += fi('Diagnostic', row.id_lab_pk_diagnostic, 'laboratory', 'diagnostic', 'lab_diagnostic');
        h += '</div>';

        h += '<div class="section-title">Radiologi</div>';
        h += '<div class="fhir-grid">';
        h += fi('Request', row.id_rad_request, 'radiology', 'request', 'rad_request');
        h += fi('Specimen', row.id_rad_specimen, 'radiology', 'specimen', 'rad_specimen');
        h += fi('Observation', row.id_rad_observation, 'radiology', 'observation', 'rad_observation');
        h += fi('Diagnostic', row.id_rad_diagnostic, 'radiology', 'diagnostic', 'rad_diagnostic');
        h += '</div>';

        h += '<div class="section-title">Organisasi & Lokasi</div>';
        h += '<div class="fhir-grid">';
        h += '<span class="fhir-item"><span class="fhir-label">ID Dept</span><span class="fhir-val '+(row.id_organisasi?'sent':'empty')+'">'+(row.id_organisasi||'-')+'</span></span>';
        h += '<span class="fhir-item"><span class="fhir-label">ID Lokasi</span><span class="fhir-val '+(row.id_lokasi?'sent':'empty')+'">'+(row.id_lokasi||'-')+'</span></span>';
        h += '</div>';
        h += '</div>';
        return h;
    }

    function loadTable() {
        if ($.fn.DataTable.isDataTable('#responseTable')) {
            $('#responseTable').DataTable().destroy();
        }
        var url = '/api/response?tanggal_awal=' + encodeURIComponent(tanggal_awal) + '&tanggal_akhir=' + encodeURIComponent(tanggal_akhir);

        window.responseTable = $('#responseTable').DataTable({
            processing: true,
            serverSide: true,
            ajax: {
                url: url,
                type: 'GET',
                dataSrc: function(json) { return json.data || []; },
                error: function(xhr, error, thrown) {
                    console.error('DataTables error:', error, thrown, xhr.responseText);
                }
            },
            language: { search: "", searchPlaceholder: "Cari pasien..." },
            columns: [
                {
                    className: 'details-control',
                    orderable: false,
                    data: null,
                    defaultContent: '<i class="fa fa-plus-square-o"></i>',
                    width: '20px'
                },
                { data: 'tgl_registrasi', width: '80px' },
                { data: 'no_rawat', width: '140px' },
                { data: 'no_rkm_medis', width: '110px', render: function(data, type, row) {
                    var noRawat = (row.no_rawat||'').replace(/\//g, '--');
                    var hasDx = row.diagnosa_pasien && row.diagnosa_pasien.kd_penyakit;
                    var html = data;
                    if(!row.id_encounter && hasDx && row.tgl_pulang) {
                        html += '<br><a href="#" class="btn btn-xs btn-info btn-action" data-id="'+noRawat+'" data-tipe="encounterbundle" title="Kirim Encounter"><i class="fa fa-plus"></i></a>' +
                            ' <a href="#" class="btn btn-xs btn-danger btn-action" data-id="'+noRawat+'" data-tipe="forwardnorawat" title="Kirim Semua"><i class="fa fa-send"></i></a>';
                    } else if(!row.id_encounter && !row.tgl_pulang && !hasDx) {
                        html += '<br><span class="badge badge-error" style="font-size:9px;">Belum Closing & Input Dx</span>';
                    } else if(!row.id_encounter && !row.tgl_pulang) {
                        html += '<br><span class="badge badge-error" style="font-size:9px;">Belum Closing</span>';
                    } else if(!row.id_encounter && row.tgl_pulang && !hasDx) {
                        html += '<br><span class="badge badge-error" style="font-size:9px;">Belum Input Diagnosa</span>';
                    } else if(row.id_encounter && row.id_condition) {
                        html += '<br><span class="badge badge-success" style="font-size:9px;">Sudah Kirim</span>';
                    } else if(row.id_encounter && !row.id_condition) {
                        html += '<br><span class="badge badge-warning" style="font-size:9px;">Kirim Sebagian</span>';
                    }
                    return html;
                }},
                { data: 'nm_pasien' },
                { data: 'nm_dokter', render: function(d,t,row) {
                    return '<span title="'+(row.kd_dokter||'')+'">'+(d||'-')+'</span>';
                }},
                { data: 'nm_poli', width: '70px' },
                { data: 'stts', width: '90px', render: function(d,t,row) {
                    var lanjut = row.status_lanjut || '';
                    var cls = lanjut === 'Ralan' ? 'info' : (lanjut === 'Ranap' ? 'warning' : 'default');
                    return '<span class="badge badge-'+cls+'" style="font-size:10px;">'+lanjut+'</span> ' +
                           '<span class="text-muted" style="font-size:10px;">'+(d||'')+'</span>';
                }},
                { data: null, orderable: false, width: '80px', render: function(d,t,row) {
                    var sent = countFhirSent(row);
                    if(sent === 0) return '<span class="badge badge-error" style="font-size:10px;">0 terkirim</span>';
                    if(sent < 5) return '<span class="badge badge-warning" style="font-size:10px;">'+sent+' terkirim</span>';
                    return '<span class="badge badge-success" style="font-size:10px;">'+sent+' terkirim</span>';
                }}
            ],
            order: [[1, 'desc']],
            lengthChange: false,
            pageLength: 15,
            dom: "<<'data-table-title'><'datatable-search'f>><'row'<'col-sm-12'tr>><<'pmd-datatable-pagination' l i p>>"
        });
    }

    loadTable();

    // Expand/collapse detail row
    $('#responseTable tbody').on('click', 'td.details-control', function() {
        var tr = $(this).closest('tr');
        var row = window.responseTable.row(tr);
        if(row.child.isShown()) {
            row.child.hide();
            tr.removeClass('shown');
            $(this).html('<i class="fa fa-plus-square-o"></i>');
        } else {
            row.child(formatDetail(row.data())).show();
            tr.addClass('shown');
            $(this).html('<i class="fa fa-minus-square-o"></i>');
        }
    });

    // Date filter
    $('#btnFilterDate').on('click', function(e){
        e.preventDefault();
        tanggal_awal = $('#tanggal_awal').val();
        tanggal_akhir = $('#tanggal_akhir').val();
        loadTable();
    });

    // Action modal
    $(document).on('click', '.btn-action', function(e){
        e.preventDefault();
        var id = $(this).data('id');
        var tipe = $(this).data('tipe');
        var ttv = $(this).data('ttv') || '';

        if(tipe === 'forwardnorawat') {
            processForwardNoRawat(id);
            return;
        }

        var url;
        var routeMap = {
            'clinicalimpression': 'clinical-impression',
            'careplan': 'care-plan',
            'dietgizi': 'composition'
        };
        var apiTipe = routeMap[tipe] || tipe;
        if(tipe === 'encounterbundle') {
            url = '/api/encounter/' + id + '?bundle=1';
        } else if(ttv) {
            url = '/api/' + apiTipe + '/' + id + '/' + ttv;
        } else {
            url = '/api/' + apiTipe + '/' + id;
        }
        $('#modalContent').html('<div class="modal-body text-center"><i class="fa fa-spinner fa-spin fa-2x"></i> Mengirim data...</div>');
        $('#actionModal').modal('show');
        $.get(url, function(resp) {
            var pretty = typeof resp === 'string' ? resp : JSON.stringify(resp, null, 2);
            var pesan = '';
            if(resp && resp.pesan) pesan = '<div class="alert alert-'+(resp.pesan.indexOf('Sukses')!==-1?'success':'danger')+'" style="margin-bottom:8px;padding:8px;">'+resp.pesan+'</div>';
            $('#modalContent').html(
                '<div class="modal-header"><button type="button" class="close" data-dismiss="modal">&times;</button><h4 class="modal-title">Kirim Data Satu Sehat</h4></div>' +
                '<div class="modal-body">'+pesan+'<pre style="max-height:400px;overflow:auto;font-size:11px;">'+$('<div>').text(pretty).html()+'</pre></div>' +
                '<div class="modal-footer"><button type="button" class="btn btn-primary" data-dismiss="modal">Tutup</button></div>'
            );
        }).fail(function(xhr){
            $('#modalContent').html(
                '<div class="modal-header"><button type="button" class="close" data-dismiss="modal">&times;</button><h4 class="modal-title text-danger">Error</h4></div>' +
                '<div class="modal-body"><pre>'+xhr.responseText+'</pre></div>' +
                '<div class="modal-footer"><button type="button" class="btn btn-primary" data-dismiss="modal">Tutup</button></div>'
            );
        });
    });

    function processForwardNoRawat(id) {
        var noRawatDisplay = id.replace(/--/g, '/');
        var steps = [
            {name: 'Encounter', url: '/api/encounter/' + id},
            {name: 'Condition', url: '/api/condition/' + id},
            {name: 'Obs. Tensi', url: '/api/observation/' + id + '/tensi'},
            {name: 'Obs. Nadi', url: '/api/observation/' + id + '/nadi'},
            {name: 'Obs. Respirasi', url: '/api/observation/' + id + '/respirasi'},
            {name: 'Obs. Suhu', url: '/api/observation/' + id + '/suhu'},
            {name: 'Obs. SpO2', url: '/api/observation/' + id + '/spo2'},
            {name: 'Obs. GCS', url: '/api/observation/' + id + '/gcs'},
            {name: 'Obs. Kesadaran', url: '/api/observation/' + id + '/kesadaran'},
            {name: 'Obs. Berat', url: '/api/observation/' + id + '/berat'},
            {name: 'Obs. Tinggi', url: '/api/observation/' + id + '/tinggi'},
            {name: 'Obs. Perut', url: '/api/observation/' + id + '/perut'},
            {name: 'Procedure', url: '/api/procedure/' + id},
            {name: 'Clinical Impression', url: '/api/clinical-impression/' + id},
            {name: 'Care Plan', url: '/api/care-plan/' + id},
            {name: 'Allergy', url: '/api/allergy/' + id},
            {name: 'Med. Request', url: '/api/medication/' + id + '/request'},
            {name: 'Med. Dispense', url: '/api/medication/' + id + '/dispense'},
            {name: 'Med. Statement', url: '/api/medication/' + id + '/statement'},
            {name: 'Lab. Request', url: '/api/laboratory/' + id + '/request'},
            {name: 'Lab. Specimen', url: '/api/laboratory/' + id + '/specimen'},
            {name: 'Lab. Observation', url: '/api/laboratory/' + id + '/observation'},
            {name: 'Lab. Diagnostic', url: '/api/laboratory/' + id + '/diagnostic'},
            {name: 'Rad. Request', url: '/api/radiology/' + id + '/request'},
            {name: 'Rad. Specimen', url: '/api/radiology/' + id + '/specimen'},
            {name: 'Rad. Observation', url: '/api/radiology/' + id + '/observation'},
            {name: 'Rad. Diagnostic', url: '/api/radiology/' + id + '/diagnostic'}
        ];

        var parallelSteps = steps.slice(1, 16);

        var html = '<div class="modal-header">' +
            '<button type="button" class="close" data-dismiss="modal">&times;</button>' +
            '<h4 class="modal-title"><i class="fa fa-send"></i> Proses ' + noRawatDisplay + '</h4></div>' +
            '<div class="modal-body" style="max-height:500px;overflow-y:auto;padding:10px 15px;">' +
            '<div class="alert alert-info" style="padding:8px;margin-bottom:10px;font-size:12px;">' +
            '<i class="fa fa-info-circle"></i> Mengirim ' + steps.length + ' resource FHIR (paralel, max 3 concurrent)...</div>' +
            '<table class="table table-condensed" style="font-size:12px;margin:0;">' +
            '<thead><tr><th style="width:25px">#</th><th>Resource</th><th style="width:100px;">Status</th><th>ID Satu Sehat</th></tr></thead><tbody>';
        for(var i=0; i<steps.length; i++) {
            html += '<tr id="step-'+i+'"><td>'+(i+1)+'</td><td>'+steps[i].name+'</td>' +
                '<td class="step-status"><span class="text-muted"><i class="fa fa-clock-o"></i> Menunggu</span></td>' +
                '<td class="step-id text-muted" style="font-size:10px;font-family:monospace;">-</td></tr>';
        }
        html += '</tbody></table></div>' +
            '<div class="modal-footer">' +
            '<span id="processProgress" class="pull-left" style="line-height:34px;font-size:12px;">0 / '+steps.length+'</span>' +
            '<button type="button" class="btn btn-default" data-dismiss="modal">Tutup</button></div>';

        $('#modalContent').html(html);
        $('#actionModal').modal({backdrop:'static', keyboard:false});

        var completed = 0, successCount = 0, errorCount = 0, skipCount = 0, total = steps.length;

        function updateProgress() {
            completed++;
            $('#processProgress').text(completed + ' / ' + total);
            if(completed >= total) {
                var parts = [];
                if(successCount > 0) parts.push(successCount + ' sukses');
                if(errorCount > 0) parts.push(errorCount + ' gagal');
                if(skipCount > 0) parts.push(skipCount + ' dilewati');
                $('#processProgress').html('<span class="text-success"><i class="fa fa-check"></i> Selesai — ' + parts.join(', ') + '</span>');
            }
        }

        function sendStep(stepIdx) {
            var step = steps[stepIdx];
            var $row = $('#step-'+stepIdx);
            $row.find('.step-status').html('<span class="text-primary"><i class="fa fa-spinner fa-spin"></i> Mengirim...</span>');

            return $.ajax({ url: step.url, method: 'GET', dataType: 'json', timeout: 60000
            }).then(function(data) {
                var resID = '-';

                // Check for explicit "skipped" status (no data to send)
                if(data && data.status === 'skipped') {
                    $row.find('.step-status').html('<span class="text-muted"><i class="fa fa-minus-circle"></i> Dilewati</span>');
                    $row.find('.step-id').html('<small class="text-muted">'+(data.pesan||'Tidak ada data')+'</small>');
                    skipCount++;
                    updateProgress();
                    return {ok: true, skipped: true, idx: stepIdx};
                }

                // Check for explicit "error" status
                if(data && data.status === 'error') {
                    var errMsg = data.pesan || 'Gagal';
                    $row.find('.step-status').html('<span class="text-danger"><i class="fa fa-times"></i> Gagal</span>');
                    $row.find('.step-id').html('<small class="text-danger" title="'+$('<span>').text(errMsg).html()+'">'+$('<span>').text(errMsg).html().substring(0,60)+'</small>');
                    errorCount++;
                    updateProgress();
                    return {ok: false, idx: stepIdx};
                }

                // Check for explicit "success" status
                if(data && data.status === 'success') {
                    resID = data.id || '-';
                    $row.find('.step-status').html('<span class="text-success"><i class="fa fa-check"></i> Sukses</span>');
                    $row.find('.step-id').text(resID);
                    successCount++;
                    updateProgress();
                    return {ok: true, idx: stepIdx};
                }

                // Fallback: legacy detection for responses without explicit status
                var hasError = false;
                if(data && data.issue) hasError = true;
                if(data && data.error && !data.response && !data.responses) hasError = true;
                if(data && data.pesan && data.pesan.indexOf('Gagal') !== -1) hasError = true;
                if(data && data.response && data.response.resourceType === 'OperationOutcome') hasError = true;
                if(data && data.id) resID = data.id;
                else if(data && data.response && data.response.id) resID = data.response.id;

                if(hasError) {
                    var errMsg = 'Error';
                    if(data.error) errMsg = data.error;
                    else if(data.pesan) errMsg = data.pesan;
                    else if(data.issue && data.issue[0]) errMsg = data.issue[0].diagnostics || data.issue[0].details.text || 'Error';
                    $row.find('.step-status').html('<span class="text-danger"><i class="fa fa-times"></i> Gagal</span>');
                    $row.find('.step-id').html('<small class="text-danger" title="'+$('<span>').text(errMsg).html()+'">'+$('<span>').text(errMsg).html().substring(0,60)+'</small>');
                    errorCount++;
                } else {
                    $row.find('.step-status').html('<span class="text-success"><i class="fa fa-check"></i> Sukses</span>');
                    $row.find('.step-id').text(resID);
                    successCount++;
                }
                updateProgress();
                return {ok: !hasError, idx: stepIdx};
            }, function(xhr) {
                var errMsg = 'HTTP ' + xhr.status;
                try { var r = JSON.parse(xhr.responseText); if(r.error) errMsg = r.error; } catch(e){}
                $row.find('.step-status').html('<span class="text-danger"><i class="fa fa-times"></i> Gagal</span>');
                $row.find('.step-id').html('<small class="text-danger">'+$('<span>').text(errMsg).html().substring(0,60)+'</small>');
                errorCount++;
                updateProgress();
                return $.Deferred().resolve({ok: false, idx: stepIdx}).promise();
            });
        }

        function runSequential(indices) {
            var d = $.Deferred().resolve();
            $.each(indices, function(_, stepIdx) {
                d = d.then(function() { return sendStep(stepIdx); });
            });
            return d;
        }

        function runParallelLimited(tasks, maxConcurrent) {
            var d = $.Deferred();
            var running = 0, queue = tasks.slice(), results = [];
            function next() {
                while(running < maxConcurrent && queue.length > 0) {
                    (function() {
                        var task = queue.shift();
                        running++;
                        task().always(function(res) {
                            results.push(res);
                            running--;
                            if(queue.length === 0 && running === 0) d.resolve(results);
                            else next();
                        });
                    })();
                }
            }
            if(tasks.length === 0) d.resolve([]); else next();
            return d.promise();
        }

        sendStep(0).then(function(res) {
            var tasks = [];
            parallelSteps.forEach(function(_, i) {
                var stepIdx = i + 1;
                tasks.push(function() { return sendStep(stepIdx); });
            });
            tasks.push(function() { return runSequential([16, 17, 18]); });
            tasks.push(function() { return runSequential([19, 20, 21, 22]); });
            tasks.push(function() { return runSequential([23, 24, 25, 26]); });
            return runParallelLimited(tasks, 3);
        });
    }

    $('#actionModal').on('hidden.bs.modal', function(){
        if(window.responseTable) window.responseTable.ajax.reload(null, false);
    });

    $('.tanggal').datetimepicker({ format: 'YYYY-MM-DD', locale: 'id' });
});
</script>
