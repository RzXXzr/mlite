{{define "content"}}
<h4><i class="fa fa-user-md"></i> Mapping Praktisi Satu Sehat</h4>
<form id="formPraktisi">
    <div class="panel panel-default">
        <div class="panel-body">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Dokter</label>
                        <select name="dokter" id="dokter" class="form-control">
                            <option value="">Pilih Dokter</option>
                            {{range .Dokter}}
                            <option value="{{.KdDokter}}">{{.NmDokter}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Tenaga Medis</label>
                        <select name="medis" id="medis" class="form-control">
                            <option value="">Pilih Praktisi</option>
                            {{range .Apoteker}}
                            <option value="{{.NIK}}">{{.Nama}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="col-md-12" style="padding-top:20px;">
                    <button type="submit" name="action" value="simpan" class="btn btn-success"><i class="fa fa-save"></i> Simpan</button>
                    <button type="submit" name="action" value="hapus" class="btn btn-danger"><i class="fa fa-trash"></i> Hapus</button>
                </div>
            </div>
        </div>
    </div>
</form>
<div class="row">
    <div class="col-md-12">
        <div class="table-responsive" id="mapping_praktisi">
            <table class="table table-striped table-bordered nowrap" id="tblPraktisi" width="100%">
                <thead>
                    <tr>
                        <th>ID Dokter & Tenaga Medis</th>
                        <th>Nama Dokter & Tenaga Medis</th>
                        <th>ID Praktisi Satu Sehat</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .MappingPraktisi}}
                    <tr class="mapping_praktisi" data-kd_dokter="{{.KdDokter}}">
                        <td>{{.KdDokter}}</td>
                        <td>{{.NmDokter}}</td>
                        <td>{{.PractitionerID}}</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
$('#tblPraktisi').DataTable({
    language: { search: "", searchPlaceholder: "Search..." },
    lengthChange: false,
    scrollX: true,
    dom: "<<'data-table-title'><'datatable-search'f>><'row'<'col-sm-12'tr>><<'pmd-datatable-pagination' l i p>>"
});
var t = $('#tblPraktisi').DataTable().rows().count();
$('.data-table-title').html('<h3 style="display:inline;float:left;margin-top:0;">Total: ' + t + '</h3>');

$('#mapping_praktisi').on('click', '.mapping_praktisi', function(){
    $('#dokter').val($(this).data('kd_dokter')).change();
});

$('#formPraktisi').on('submit', function(e){
    e.preventDefault();
    var action = $(document.activeElement).val();
    if(action === 'hapus' && !confirm('Yakin ingin menghapus?')) return;
    var data = $(this).serialize() + '&action=' + action;
    $.post('/api/mapping/praktisi', data, function(resp){
        alert(resp.message || 'Berhasil!');
        location.reload();
    }).fail(function(xhr){ alert('Error: ' + xhr.responseText); });
});
</script>
{{end}}
